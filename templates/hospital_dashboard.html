<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospital Emergency Dashboard</title>
    <style>
      /* General Page Styling */
      body {
        background-color: #f2f4f7;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      /* Main Dashboard Card */
      .dashboard-container {
        background: #ffffff;
        padding: 25px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 900px;
        text-align: center;
      }

      h2 {
        font-size: 26px;
        color: #2c3e50;
        margin-bottom: 5px;
      }

      h3 {
        font-size: 14px;
        color: #7f8c8d;
        margin-bottom: 25px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      /* Table Styling */
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 10px;
        margin-top: 10px;
      }

      th {
        color: #95a5a6;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        padding: 10px;
      }

      td {
        background: #fff;
        padding: 15px;
        border-top: 1px solid #eee;
        border-bottom: 1px solid #eee;
        color: #34495e;
        font-size: 15px;
      }

      td:first-child { border-left: 1px solid #eee; border-radius: 12px 0 0 12px; font-weight: bold; }
      td:last-child { border-right: 1px solid #eee; border-radius: 0 12px 12px 0; }

      /* Action Buttons Styling */
      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        border: none;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        font-size: 13px;
        display: inline-block;
        margin: 2px;
        transition: filter 0.2s, transform 0.1s;
      }
      .btn:active { transform: scale(0.95); }

      .btn-accept { background: #2ecc71; color: white; }
      .btn-resolve { background: #3498db; color: white; }
      .btn-nav { background: #f1f2f6; color: #57606f; border: 1px solid #dfe4ea; }

      /* Status Badges */
      .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
      .status-pending { background: #fff3cd; color: #856404; }
      .status-active { background: #d4edda; color: #155724; }

      @media (max-width: 600px) {
        .btn { width: 100%; margin: 5px 0; }
        td { padding: 10px 5px; font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <h2>🚑 Hospital Dashboard</h2>
      <h3>Live Emergency Feed</h3>

      <table id="emergencyTable">
        <thead>
          <tr>
            <th>Citizen</th>
            <th>Type</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for e in emergencies %}
          <tr>
            <td>{{ e.citizen.name }}</td>
            <td><strong>{{ e.get_emergency_type_display }}</strong></td>
            <td>
              <span class="status-badge {% if e.status|lower == 'pending' %}status-pending{% else %}status-active{% endif %}">
                {{ e.status }}
              </span>
            </td>
            <td>
              {% if e.status|lower == 'pending' %}
              <a href="{% url 'accept_emergency' e.id 'hospital' %}" class="btn btn-accept">Accept</a>
              {% endif %}
              <a href="{% url 'resolve_emergency' e.id %}" class="btn btn-resolve">Resolve</a>
              <a target="_blank" href="https://www.google.com/maps?q={{ e.latitude }},{{ e.longitude }}" class="btn btn-nav">📍 Map</a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="4" style="text-align: center">No active emergencies.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <script>
      const csrftoken = '{{ csrf_token }}';

      // Handle Accept and Resolve button clicks
      document.addEventListener("click", function(e) {
        // Accept button
        if (e.target.classList.contains("btn-accept")) {
          e.preventDefault();
          fetch(e.target.href, { method: "POST", headers: { "X-CSRFToken": csrftoken } })
            .then(res => { if(res.ok) e.target.style.display = "none"; else alert("Failed to accept."); })
            .catch(err => console.error(err));
        }

        // Resolve button
        if (e.target.classList.contains("btn-resolve")) {
          e.preventDefault();
          const row = e.target.closest("tr");
          fetch(e.target.href, { method: "POST", headers: { "X-CSRFToken": csrftoken } })
            .then(res => { if(res.ok) row.remove(); else alert("Failed to resolve."); })
            .catch(err => console.error(err));
        }
      });

      // Live update function
      function loadEmergencies() {
        fetch("/emergency-live/")
          .then(res => res.json())
          .then(data => {
            const tableBody = document.querySelector("#emergencyTable tbody");
            if (!data.emergencies || data.emergencies.length === 0) {
              tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No active emergencies.</td></tr>';
              return;
            }

            let newRows = "";
            data.emergencies.forEach(e => {
              const statusClass = e.status.toLowerCase() === "pending" ? "status-pending" : "status-active";
              newRows += `
                <tr>
                  <td>${e.citizen}</td>
                  <td><strong>${e.type}</strong></td>
                  <td><span class="status-badge ${statusClass}">${e.status}</span></td>
                  <td>
                    ${e.status.toLowerCase() === "pending" ? `<a href="/accept-emergency/${e.id}/hospital/" class="btn btn-accept">Accept</a>` : ""}
                    <a href="/resolve-emergency/${e.id}/" class="btn btn-resolve">Resolve</a>
                    <a target="_blank" href="https://www.google.com/maps?q=${e.lat},${e.lng}" class="btn btn-nav">📍 Map</a>
                  </td>
                </tr>
              `;
            });
            tableBody.innerHTML = newRows;
          })
          .catch(err => console.error("Error fetching updates:", err));
      }

      setInterval(loadEmergencies, 3000);
    </script>
  </body>
</html>
