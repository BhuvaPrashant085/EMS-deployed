<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citizen Signup</title>
    <style>
      /* Centers everything on the screen */
      body {
        background-color: #f2f4f7;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center; /* Horizontal center */
        align-items: center; /* Vertical center */
        min-height: 100vh; /* Full screen height */
        margin: 0;
      }

      /* The Card for Signup/Login */
      .dashboard-container {
        background: #ffffff;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px; /* Slim for forms */
        text-align: center;
        box-sizing: border-box;
      }

      h2 {
        color: #2c3e50;
        margin-bottom: 25px;
      }

      /* Input Styling */
      input[type="text"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: 2px solid #eee;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
        transition: border-color 0.3s;
      }

      input:focus {
        outline: none;
        border-color: #3498db;
      }

      /* Submit Button */
      button[type="submit"] {
        width: 100%;
        background: #3498db;
        color: white;
        border: none;
        padding: 15px;
        border-radius: 10px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.3s;
      }

      button[type="submit"]:hover {
        background: #2980b9;
      }

      /* Error Messages */
      .error-text {
        color: #e74c3c;
        font-size: 14px;
        margin-bottom: 10px;
      }

      /* Link to Login */
      .nav-link {
        display: block;
        margin-top: 15px;
        color: #3498db;
        text-decoration: none;
        font-size: 14px;
      }

      .nav-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <h2>Citizen Signup</h2>

      {% if error %}
      <p class="error-text">{{ error }}</p>
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="text" name="phone" placeholder="Phone" required />
        <input type="text" name="address" placeholder="Address" required />
        <button type="submit">Sign Up</button>
      </form>

      <a href="/login/" class="nav-link">Already have an account? Login</a>
    </div>
  </body>
</html>
