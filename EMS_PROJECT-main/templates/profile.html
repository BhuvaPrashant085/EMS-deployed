<style>
  /* Container and General Reset */
  body {
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .profile-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 500px;
  }

  h2 {
    color: #2c3e50;
    margin-bottom: 25px;
    text-align: center;
    border-bottom: 2px solid #eef2f3;
    padding-bottom: 10px;
  }

  /* Form Layout */
  form {
    display: flex;
    flex-direction: column;
  }

  label {
    font-weight: 600;
    margin-bottom: 5px;
    font-size: 0.9rem;
    color: #555;
  }

  input,
  textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 1rem;
    box-sizing: border-box; /* Ensures padding doesn't affect width */
    transition: border-color 0.3s ease;
  }

  input:focus,
  textarea:focus {
    outline: none;
    border-color: #3498db;
    box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
  }

  /* Readonly Styling */
  input[readonly] {
    background-color: #f9f9f9;
    color: #888;
    cursor: not-allowed;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  /* Button Styling */
  button[type="submit"] {
    background-color: #2ecc71;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
    margin-top: 10px;
  }

  button[type="submit"]:hover {
    background-color: #27ae60;
  }

  /* Back Link Styling */
  .back-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    text-decoration: none;
    color: #7f8c8d;
    font-size: 0.9rem;
  }

  .back-link:hover {
    color: #34495e;
  }
</style>
<div class="profile-container">
  <h2>Citizen Profile</h2>

  <form method="POST">
    {% csrf_token %}

    <label>Full Name</label>
    <input type="text" name="name" value="{{ citizen.name }}" />

    <label>Email (Permanent)</label>
    <input type="email" name="email" value="{{ citizen.email }}" readonly />

    <label>Phone Number</label>
    <input type="text" name="phone" value="{{ citizen.phone }}" />

    <input
      type="email"
      name="trusted1_email"
      placeholder="Trusted Contact 1 Email"
      value="{{ citizen.trusted_contact1_email }}"
    />
    <input
      type="text"
      name="trusted1_phone"
      placeholder="Trusted Contact 1 Phone"
      value="{{ citizen.trusted_contact1_phone }}"
    />
    <input
      type="email"
      name="trusted2_email"
      placeholder="Trusted Contact 2 Email"
      value="{{ citizen.trusted_contact2_email }}"
    />
    <input
      type="text"
      name="trusted2_phone"
      placeholder="Trusted Contact 2 Phone"
      value="{{ citizen.trusted_contact2_phone }}"
    />

    <label>Blood Group</label>
    <input type="text" name="blood_group" value="{{ citizen.blood_group }}" />

    <label>Medical Issues</label>
    <textarea name="medical_issue">{{ citizen.medical_issue }}</textarea>

    <label>Address</label>
    <textarea name="address">{{ citizen.address }}</textarea>

    <button type="submit">Save Profile</button>
  </form>

  <a href="/citizen_dashboard/" class="back-link">⬅ Back to Dashboard</a>
</div>
